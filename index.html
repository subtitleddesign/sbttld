<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>subtitles.</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ════════════════════════════════════════════════════════════════
   GAME SECTION — self-contained drop-in
   ════════════════════════════════════════════════════════════════ */

.subtitles-game-section {
  width: 100%;
  border-top: 1px solid #e8e8e8;
}

.sg-shell {
  width: 100%;
  overflow: hidden;
}

.sg-shell canvas {
  display: block;
  width: 100%;
  height: 440px;
  cursor: none;
  background: #fff;
}
</style>
</head>
<body>

<!-- ── GAME SECTION ── -->
<section class="subtitles-game-section">
  <div class="sg-shell">
    <canvas id="subtitles-game"></canvas>
  </div>
</section>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('subtitles-game');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // ── SVG assets ─────────────────────────────────────────────────
  const SVG_S   = 'https://static.wixstatic.com/shapes/c075ce_1a7aa87f422a4bf3b1ddbe7231812dec.svg';
  const SVG_BAR = 'https://static.wixstatic.com/shapes/c075ce_11f249ee6960400d9fb0f062c7a53111.svg';

  const imgS   = new Image(); imgS.src   = SVG_S;
  const imgBar = new Image(); imgBar.src = SVG_BAR;

  // ── Constants ──────────────────────────────────────────────────
  const LIVES      = 3;
  const PADDLE_H   = 18;  // px — bar SVG stretched to this height

  // ── Sizing helpers ─────────────────────────────────────────────
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rnd   = (lo, hi)    => lo + Math.random() * (hi - lo);

  let W, H;
  const sSize   = () => clamp(Math.round(H * 0.115), 32, 58);
  const sRadius = () => sSize() * 0.43;

  // ── State ──────────────────────────────────────────────────────
  let phase = 'idle';
  let score, lives, hiScore = 0;
  let paddle, ball, mouseX = -1;

  // ── Init ───────────────────────────────────────────────────────
  function init() {
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width  = W;
    canvas.height = H;

    const pw = clamp(W * 0.22, 120, 260);
    paddle = { x: W / 2 - pw / 2, y: H - 44, w: pw };

    ball = {
      x: W / 2,
      y: paddle.y - sRadius() - 4,
      vx: 0, vy: 0,
      angle: 0,
      stuck: true,
    };

    score  = 0;
    lives  = LIVES;
    phase  = 'idle';
  }

  // ── Serve ──────────────────────────────────────────────────────
  function serve() {
    if (phase === 'over') init();
    const spd  = clamp(H * 0.006, 3, 5);
    const a    = -Math.PI / 2 + rnd(-0.45, 0.45);
    ball.vx    = Math.cos(a) * spd;
    ball.vy    = Math.sin(a) * spd;
    ball.stuck = false;
    phase      = 'play';
  }

  // ── Input ──────────────────────────────────────────────────────
  function ptrX(e) {
    const r = canvas.getBoundingClientRect();
    return ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (W / r.width);
  }

  canvas.addEventListener('mousemove',  e => { mouseX = ptrX(e); });
  canvas.addEventListener('click',      e => { mouseX = ptrX(e); serve(); });
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); mouseX = ptrX(e); }, { passive: false });
  canvas.addEventListener('touchstart', e => { mouseX = ptrX(e); serve(); }, { passive: false });
  document.addEventListener('keydown',  e => {
    if (e.code === 'Space') { e.preventDefault(); serve(); }
  });

  // ── Update ─────────────────────────────────────────────────────
  function update() {
    if (mouseX >= 0) {
      paddle.x = clamp(mouseX - paddle.w / 2, 0, W - paddle.w);
    }

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - sRadius() - 4;
    }

    if (phase !== 'play') return;

    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.angle += ball.vx * 0.055; // spin driven by horizontal velocity

    const r = sRadius();

    // walls
    if (ball.x - r < 0)  { ball.x = r;     ball.vx =  Math.abs(ball.vx); }
    if (ball.x + r > W)  { ball.x = W - r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - r < 0)  { ball.y = r;     ball.vy =  Math.abs(ball.vy); }

    // prevent perfectly horizontal travel
    if (Math.abs(ball.vy) < 1) ball.vy = ball.vy < 0 ? -1 : 1;

    // paddle
    const { x: px, y: py, w: pw } = paddle;
    if (
      ball.vy > 0 &&
      ball.y + r >= py &&
      ball.y - r <= py + PADDLE_H + 5 &&
      ball.x + r >= px &&
      ball.x - r <= px + pw
    ) {
      const rel   = clamp((ball.x - (px + pw / 2)) / (pw / 2), -1, 1);
      const angle = rel * (58 * Math.PI / 180) - Math.PI / 2;
      const spd   = clamp(Math.hypot(ball.vx, ball.vy), 3, H * 0.012);
      ball.vx = Math.cos(angle) * spd;
      ball.vy = Math.sin(angle) * spd;
      ball.y  = py - r - 1;
      score++;

      // gentle speed increase every 5 hits
      if (score % 5 === 0) {
        const s  = Math.hypot(ball.vx, ball.vy);
        const ns = Math.min(s * 1.08, H * 0.014);
        ball.vx  = (ball.vx / s) * ns;
        ball.vy  = (ball.vy / s) * ns;
      }
    }

    // ball lost
    if (ball.y - r > H + 30) {
      if (--lives <= 0) {
        hiScore = Math.max(hiScore, score);
        phase   = 'over';
      } else {
        ball.stuck = true;
        ball.vx    = 0;
        ball.vy    = 0;
        phase      = 'idle';
      }
    }
  }

  // ── Draw helpers ───────────────────────────────────────────────
  function drawS(x, y, size, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (imgS.complete && imgS.naturalWidth > 0) {
      ctx.drawImage(imgS, -size / 2, -size / 2, size, size);
    } else {
      // fallback until SVG loads
      ctx.font         = `900 ${size}px Georgia, serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#000';
      ctx.fillText('S', 0, 2);
    }
    ctx.restore();
  }

  function drawBar(x, y, w) {
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, w, PADDLE_H);   // always draw solid black bar
    if (imgBar.complete && imgBar.naturalWidth > 0) {
      ctx.drawImage(imgBar, x, y, w, PADDLE_H); // SVG on top if loaded
    }
  }

  // ── Draw ───────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (phase === 'over') {
      // white wash
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);

      // big spinning S centred
      const bigSz = sSize() * 2.2;
      drawS(W / 2, H / 2 - H * 0.08, bigSz, ball.angle);

      // minimal restart hint
      ctx.save();
      ctx.fillStyle    = '#000';
      ctx.globalAlpha  = 0.18;
      ctx.font         = `10px 'Courier New', monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      const sub = hiScore > 0
        ? `${score}  ·  best ${hiScore}  ·  click to retry`
        : `${score}  ·  click to retry`;
      ctx.fillText(sub, W / 2, H / 2 + sSize() * 1.25);
      ctx.restore();
      return;
    }

    // bar (paddle)
    drawBar(paddle.x, paddle.y, paddle.w);

    // ball
    drawS(ball.x, ball.y, sSize(), ball.angle);

    // minimal HUD: score right, lives left
    ctx.save();
    ctx.fillStyle    = '#000';
    ctx.globalAlpha  = 0.2;
    ctx.font         = `10px 'Courier New', monospace`;
    ctx.textBaseline = 'bottom';
    ctx.textAlign    = 'left';
    ctx.fillText('●'.repeat(lives) + '·'.repeat(LIVES - lives), 14, H - 12);
    ctx.textAlign    = 'right';
    ctx.fillText(String(score).padStart(4, '0'), W - 14, H - 12);
    ctx.restore();

    // serve hint on idle
    if (phase === 'idle') {
      ctx.save();
      ctx.fillStyle    = '#000';
      ctx.globalAlpha  = 0.15;
      ctx.font         = `10px 'Courier New', monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('click to serve', W / 2, H - 12);
      ctx.restore();
    }
  }

  // ── Loop ───────────────────────────────────────────────────────
  function loop() { update(); draw(); requestAnimationFrame(loop); }

  window.addEventListener('resize', init);
  init();
  loop();
}());
</script>

</body>
</html>
